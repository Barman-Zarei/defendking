name: CI

# Test + lint run on every push to main. The publish job only runs when a
# version tag (e.g. "v3.6.16") is pushed, and only after test+lint pass.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev/full extras
        run: python -m pip install -e ".[full,dev]"

      - name: Run test suite
        run: python -m pytest tests/ -v

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev extras, ruff, and mypy
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install ruff mypy

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run mypy (type-check)
        run: mypy defendking/

  publish:
    name: Build & publish to PyPI
    # Only runs for pushes of a version tag like "v3.6.16", and only after
    # both test and lint succeed on that same commit.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/defendking/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) - no API token needed.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
